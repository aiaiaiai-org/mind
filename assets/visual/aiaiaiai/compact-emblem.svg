        <line x1="51" y1="45" x2="44" y2="44"/>
        <line x1="20" y1="44" x2="32" y2="52"/>
        <line x1="15" y1="47" x2="32" y2="52"/>
        <line x1="32" y1="57" x2="32" y2="52"/>
        <line x1="44" y1="44" x2="32" y2="52"/>
        <line x1="51" y1="45" x2="32" y2="52"/>
