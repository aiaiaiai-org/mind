      <g id="channels" stroke="black" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="32" y1="7" x2="32" y2="18"/>
        <line x1="17" y1="15" x2="32" y2="18"/>
        <line x1="47" y1="14" x2="32" y2="18"/>
        <line x1="17" y1="15" x2="20" y2="28"/>
        <line x1="9" y1="30" x2="20" y2="28"/>
        <line x1="32" y1="18" x2="20" y2="28"/>
        <line x1="32" y1="18" x2="44" y2="27"/>
        <line x1="47" y1="14" x2="44" y2="27"/>
        <line x1="55" y1="29" x2="44" y2="27"/>
        <line x1="20" y1="28" x2="32" y2="38"/>
        <line x1="44" y1="27" x2="32" y2="38"/>
        <line x1="20" y1="28" x2="20" y2="44"/>
        <line x1="9" y1="30" x2="20" y2="44"/>
        <line x1="15" y1="47" x2="20" y2="44"/>
        <line x1="20" y1="44" x2="32" y2="38"/>
        <line x1="32" y1="38" x2="44" y2="44"/>
        <line x1="44" y1="27" x2="44" y2="44"/>
