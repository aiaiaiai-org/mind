<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">aiaiaiai compact emblem</title>
  <desc id="desc">Cyan faceted polyhedron with transparent negative-space channels.</desc>
